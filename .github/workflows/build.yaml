name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Maven 3.6.3
        uses: s4u/setup-maven-action@v1.18.0
        with:
          java-version: '11'
          maven-version: '3.6.3'

      - name: Maven dependency/resolve
        run: mvn dependency:resolve -U

      - name: Maven install
        run: mvn install -Dmaven.javadoc.skip=true -B -V -e |& tee mvn-install.txt

      - name: Print logs
        if: ${{ always() }}
        run: |
          tail -n 500 maven-install-output.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maven-install-output.txt
          path: maven-install-output.txt
